file_format: "1.2"

instrumentation/development:
  # SNIPPET_START
  general:
    http:
      semconv:
        version: 1
        experimental: true
        dual_emit: true
      client:
        request_captured_headers:
          - Content-Type
          - Accept
        response_captured_headers:
          - Content-Type
          - Content-Encoding
        known_methods:
          - CONNECT
          - DELETE
          - GET
          - HEAD
          - OPTIONS
          - PATCH
          - POST
          - PUT
          - TRACE
      server:
        request_captured_headers:
          - Content-Type
          - Accept
        response_captured_headers:
          - Content-Type
          - Content-Encoding
        known_methods:
          - CONNECT
          - DELETE
          - GET
          - HEAD
          - OPTIONS
          - PATCH
          - POST
          - PUT
          - TRACE
    db:
      semconv:
        version: 1
        experimental: false
        dual_emit: false
    rpc:
      semconv:
        version: 1
        experimental: false
        dual_emit: true
    messaging:
      semconv:
        version: 1
        experimental: true
        dual_emit: false
    sanitization:
      url:
        sensitive_query_parameters:
          - AWSAccessKeyId
          - Signature
          - sig
          - X-Goog-Signature
    # Domain-specific semconv sections above (http, db, etc.) take precedence over this general setting.
    stability_opt_in_list: "http/dup,database"
  cpp:
    example:
      property: "value"
  dotnet:
    example:
      property: "value"
  erlang:
    example:
      property: "value"
  go:
    example:
      property: "value"
  java:
    example:
      property: "value"
  js:
    example:
      property: "value"
  php:
    example:
      property: "value"
  python:
    example:
      property: "value"
  ruby:
    example:
      property: "value"
  rust:
    example:
      property: "value"
  swift:
    example:
      property: "value"

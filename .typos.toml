[default.extend-words]
# "ba" appears in example trace IDs (e.g., "00f067aa0ba902b7")
ba = "ba"
# "ot" is the OpenTracing abbreviation used in changelog
ot = "ot"
# "caf" appears in "café" encoded as Latin-1 in a test string
caf = "caf"
# "Delt" appears in "DeltA" test string for case-insensitive Delta parsing
Delt = "Delt"
# "Alway" appears in truncated benchmark result table output
Alway = "Alway"
# "Enumerables" is the valid plural of "Enumerable" used in a method name
Enumerables = "Enumerables"
# "Udid" is Apple's acronym for the unique identifier of a device or simulator
Udid = "Udid"

# Test files that use intentionally misspelled strings to exercise schema-validation and
# diagnostic-path logic are excluded so those misspellings do not require global exceptions.
[files]
extend-exclude = [
  "test/OpenTelemetry.Configuration.Declarative.Tests/DeclarativeConfigurationReaderTests.cs",
  "test/OpenTelemetry.Configuration.Declarative.Tests/DeclarativeConfigurationEventSourceTests.cs",
]

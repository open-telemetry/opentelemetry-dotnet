name: Android Tests

on:
  workflow_call:
    inputs:
      trigger:
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  android-tests:
    name: Android end-to-end tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    permissions:
      contents: read

    strategy:
      fail-fast: ${{ inputs.trigger == 'merge_group' }}

    steps:
    - name: Setup JDK 17
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: 25.0.5+8.0.LTS

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        show-progress: false

    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
        dotnet-version: |
          10.0.x

    - name: Install android workload
      shell: bash
      run: dotnet workload install android

    - name: Install Android emulator and system image
      shell: bash
      run: |
        sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
        yes | "${sdkmanager}" --licenses > /dev/null || true
        for attempt in 1 2 3; do
          if "${sdkmanager}" --install emulator 'system-images;android-34;google_apis;x86_64' --channel=0 > /dev/null; then
            exit 0
          fi
          echo "::warning::Attempt ${attempt} to install the Android emulator and system image failed."
          sleep $((attempt * 15))
        done
        exit 1

    - name: Run Android end-to-end tests on the emulator
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        api-level: 34
        arch: x86_64
        disable-animations: true
        emulator-boot-timeout: 900
        target: google_apis
        script: |
          set +e
          dotnet test "${GITHUB_WORKSPACE}/test/OpenTelemetry.Android.Tests" --configuration Debug --report-github --report-github-summary-include-passed false
          exit_code=$?
          adb pull /storage/emulated/0/Android/data/io.opentelemetry.dotnet.android/files/TestResults ./TestResults || true
          exit $exit_code

    - name: Upload test result artifacts
      if: ${{ failure() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: android-artifacts
        if-no-files-found: ignore
        retention-days: 7
        path: |
          **/TestResults/**
          **/*.trx

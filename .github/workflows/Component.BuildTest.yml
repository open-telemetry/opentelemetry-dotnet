# Called by ci.yml to build & test project files
# See: https://docs.github.com/en/actions/using-workflows/reusing-workflows#creating-a-reusable-workflow
name: Build Component

on:
  workflow_call:
    inputs:
      project-name:
        required: true
        type: string
      project-build-commands:
        default: ''
        required: false
        type: string
      code-cov-name:
        required: true
        type: string
      code-cov-prefix:
        default: 'unittests'
        required: false
        type: string
      os-list:
        default: '[ "windows-11-arm" ]'
        required: false
        type: string
      tfm-list:
        default: '[ "net472", "net8.0", "net9.0", "net10.0" ]'
        required: false
        type: string
      trigger:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-test:
    name: build-test

    strategy:
      fail-fast: ${{ inputs.trigger == 'merge_group' }}
      matrix:
        os: ${{ fromJSON(inputs.os-list) }}
        version: ${{ fromJSON(inputs.tfm-list) }}
        exclude:
        # renovate: datasource=github-runners depType=github-runner
        - os: ubuntu-26.04
          version: net472
        # renovate: datasource=github-runners depType=github-runner
        - os: ubuntu-26.04-arm
          version: net472

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    env:
      DISABLE_APP_DOMAIN: ${{ matrix.version == 'net472' && 'false' || 'true' }}
      PROJECT_NAME: ${{ inputs.project-name }}
      PROJECT_BUILD_COMMANDS: ${{ inputs.project-build-commands }}
      TARGET_FRAMEWORK: ${{ matrix.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Note: By default GitHub only fetches 1 commit. MinVer needs to find
        # the version tag which is typically NOT on the first commit so we
        # retrieve them all.
        fetch-depth: 0
        persist-credentials: false
        show-progress: false

    - name: Enable crash dumps
      if: ${{ runner.os == 'Windows' }}
      shell: cmd
      run: |
        mkdir "%RUNNER_TEMP%\crash-dumps"
        reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpFolder /t REG_EXPAND_SZ /d "%RUNNER_TEMP%\crash-dumps" /f
        reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpType /t REG_DWORD /d 2 /f
        reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpCount /t REG_DWORD /d 10 /f
        >> "%GITHUB_ENV%" echo DOTNET_DbgEnableMiniDump=1
        >> "%GITHUB_ENV%" echo DOTNET_DbgMiniDumpType=4
        >> "%GITHUB_ENV%" echo DOTNET_DbgMiniDumpName=%RUNNER_TEMP%\crash-dumps\%%e-%%p.dmp
        >> "%GITHUB_ENV%" echo DOTNET_CreateDumpDiagnostics=1
        >> "%GITHUB_ENV%" echo DOTNET_CreateDumpLogToFile=%RUNNER_TEMP%\crash-dumps\createdump-%%p.log

    - name: Setup previous .NET runtimes
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          8.0.x
          9.0.x

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

    - name: Collect crash events
      if: ${{ failure() && runner.os == 'Windows' }}
      shell: cmd
      run: |
        wevtutil qe Application /q:"*[System[(Level=1 or Level=2 or Level=3) and TimeCreated[timediff(@SystemTime) <= 900000]]]" /c:50 /rd:true /f:text
        dir "%RUNNER_TEMP%\crash-dumps"

    # Analyzes any crash dumps with SOS. The dump is from this machine, so the matching
    # DAC is available. Uses Windows PowerShell rather than pwsh for the same reason as
    # "Enable crash dumps", and runs from the temp directory so that global.json is not
    # resolved (the SDK it pins may be the thing that failed to install). The output is
    # written next to the dumps so that it is uploaded with them.
    - name: Analyze crash dumps
      if: ${{ failure() && runner.os == 'Windows' }}
      shell: powershell
      continue-on-error: true
      timeout-minutes: 15
      working-directory: ${{ runner.temp }}
      env:
        # renovate: datasource=nuget depName=dotnet-dump
        DOTNET_DUMP_VERSION: '10.0.750501'
        DOTNET_DbgEnableMiniDump: '0'
        DOTNET_ROLL_FORWARD: 'Major'
      run: |
        $ErrorActionPreference = 'Continue'

        $dumpDir = Join-Path $env:RUNNER_TEMP 'crash-dumps'
        $dumps = @(Get-ChildItem -Path $dumpDir -Filter '*.dmp' -ErrorAction SilentlyContinue | Select-Object -First 3)
        if ($dumps.Count -eq 0) {
          Write-Host 'No crash dumps found to analyze.'
          exit 0
        }

        $toolPath = Join-Path $env:RUNNER_TEMP 'dotnet-dump'
        dotnet tool install dotnet-dump --tool-path $toolPath --version $env:DOTNET_DUMP_VERSION
        if ($LASTEXITCODE -ne 0) {
          Write-Host '::warning::Failed to install dotnet-dump, skipping crash dump analysis.'
          exit 0
        }

        $dotnetDump = Join-Path $toolPath 'dotnet-dump.exe'

        function Invoke-Sos([string] $Dump, [string[]] $Commands, [string] $RuntimeDirectory) {
          $arguments = @('analyze', $Dump)
          if ($RuntimeDirectory) {
            # Windows PowerShell 5.1 needs the embedded quotes escaped to keep the path together.
            $arguments += @('-c', ('setclrpath \"' + $RuntimeDirectory + '\"'))
          }
          foreach ($command in $Commands) {
            $arguments += @('-c', $command)
          }
          $arguments += @('-c', 'exit')
          & $dotnetDump $arguments 2>&1 | ForEach-Object { "$_" }
        }

        foreach ($dump in $dumps) {
          Write-Host "::group::Analysis of $($dump.Name)"
          $report = Join-Path $dumpDir "analysis-$($dump.BaseName).txt"

          # The runtime that crashed in pwsh is the one bundled next to pwsh.exe, so
          # point SOS at it to find the matching mscordaccore.dll.
          $runtimeDirectory = $null
          if ($dump.Name -like 'pwsh*') {
            $runtimeDirectory = Split-Path -Parent (Get-Command pwsh -ErrorAction SilentlyContinue).Source
          }

          # Pass 1: overview of the process, plus the integrity of the heap and sync blocks.
          $overview = Invoke-Sos $dump.FullName @(
            'sosstatus',
            'clrthreads',
            'clrstack -all',
            'syncblk -all',
            'dumpheap -stat',
            'dumpheap -type System.__ComObject',
            'verifyheap',
            'eeheap -gc') $runtimeDirectory

          # Pass 2: for any thread doing COM interop, show its arguments, locals and stack objects.
          $threads = @()
          $blocks = ($overview -join "`n") -split '(?=OS Thread Id: )'
          foreach ($block in $blocks) {
            # The capturing match must come last as it sets $Matches.
            if ($block -match 'IL_STUB|GetCOMIPFromRCW|CreateElevatedEntry|TaskbarJumpList|__ComObject' -and
                $block -match 'OS Thread Id: 0x([0-9a-fA-F]+)') {
              $threads += $Matches[1]
            }
          }

          $suspects = @()
          foreach ($thread in ($threads | Select-Object -Unique -First 5)) {
            # SOS expects the OS thread id in decimal.
            $osThreadId = [Convert]::ToUInt32($thread, 16)
            $stack = Invoke-Sos $dump.FullName @("setthread -t $osThreadId", 'clrstack -a', 'dumpstackobjects') $runtimeDirectory
            $suspects += "===== Thread 0x$thread (COM interop) ====="
            $suspects += $stack

            # Pass 3: describe every distinct object found on that thread's stack.
            # Only the lines after the dumpstackobjects header list objects (clrstack lines look similar).
            $header = [Array]::FindIndex([string[]]$stack, [Predicate[string]]{ param($line) $line -match 'SP/REG\s+Object' })
            $addresses = @()
            if ($header -ge 0) {
              $addresses = @($stack[($header + 1)..($stack.Count - 1)] |
                ForEach-Object { if ($_ -match '^\s*[0-9a-fA-F]{8,16}\s+([0-9a-fA-F]{8,16})\s+\S') { $Matches[1] } } |
                Select-Object -Unique -First 25)
            }
            if ($addresses.Count -gt 0) {
              $suspects += "===== Objects referenced from thread 0x$thread ====="
              $suspects += Invoke-Sos $dump.FullName ($addresses | ForEach-Object { "dumpobj $_" }) $runtimeDirectory
            }
          }

          $output = @('===== Overview =====') + $overview + $suspects
          $output | Out-File -FilePath $report -Encoding utf8
          $output | ForEach-Object { Write-Host $_ }
          Write-Host '::endgroup::'
        }

    - name: Upload hang dumps and test platform logs
      if: ${{ failure() || cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        if-no-files-found: ignore
        name: hang-dumps-${{ inputs.code-cov-prefix }}-${{ inputs.code-cov-name }}-${{ matrix.os }}-${{ matrix.version }}-attempt-${{ github.run_attempt }}
        retention-days: 7
        path: |
          ${{ runner.temp }}/crash-dumps/*
          **/TestResults/**/*hangdump*.dmp
          **/TestResults/**/Sequence_*.xml
          **/TestResults/diag/*

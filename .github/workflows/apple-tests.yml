name: Apple Tests

on:
  workflow_call:
    inputs:
      trigger:
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  apple-tests:
    name: Apple (iOS) end-to-end tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    permissions:
      contents: read

    strategy:
      fail-fast: ${{ inputs.trigger == 'merge_group' }}
      matrix:
        include:
          - version: net10.0
            runner: xcode-27
          - version: net11.0
            runner: macos-26

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        show-progress: false

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

    - name: Install ios workload
      shell: bash
      run: dotnet workload install ios

    - name: Select the Xcode version required by the ios workload
      shell: bash
      env:
        DOTNET_NOLOGO: 'true'
        TARGET_FRAMEWORK: ${{ matrix.version }}
      run: |
        project="test/OpenTelemetry.Apple.TestApp/OpenTelemetry.Apple.TestApp.csproj"
        get_property() {
          dotnet msbuild "${project}" -getProperty:"$1" -p:TargetFramework="${TARGET_FRAMEWORK}-ios" | tail -n 1 | tr -d '[:space:]'
        }

        required=$(get_property RecommendedXcodeVersion)
        if [ -z "${required}" ]; then
          required=$(get_property _RecommendedXcodeVersion)
        fi
        if ! [[ "${required}" =~ ^[0-9]+\.[0-9]+ ]]; then
          echo "::error::Unable to determine the Xcode version required by the ios workload (got '${required}')."
          exit 1
        fi
        required="${BASH_REMATCH[0]}"
        echo "The ios workload requires Xcode ${required}."

        available=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sed -e 's|.*/Xcode_||' -e 's|\.app$||' | grep -E '^[0-9]+(\.[0-9]+)*$' | sort -t. -k1,1n -k2,2n -k3,3n)
        version=$(echo "${available}" | grep -E "^${required//./\\.}(\.|$)" | tail -n 1)
        if [ -z "${version}" ]; then
          echo "::error::Xcode ${required} is required by the ios workload but is not installed on the runner. Available versions: $(echo "${available}" | paste -sd ' ' -)."
          exit 1
        fi

        developer_dir="/Applications/Xcode_${version}.app/Contents/Developer"
        sudo xcode-select --switch "${developer_dir}"
        echo "DEVELOPER_DIR=${developer_dir}" >> "${GITHUB_ENV}"
        xcodebuild -version

    - name: Run Apple end-to-end tests on the simulator
      shell: bash
      env:
        TARGET_FRAMEWORK: ${{ matrix.version }}
      run: dotnet test test/OpenTelemetry.Apple.Tests/OpenTelemetry.Apple.Tests.csproj --configuration Debug --framework "${TARGET_FRAMEWORK}" --logger:"GitHubActions;report-warnings=false;summary-include-passed=false"

    - name: Upload test result artifacts
      if: ${{ failure() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: apple-artifacts
        if-no-files-found: ignore
        retention-days: 7
        path: |
          **/TestResults/**
          **/*.trx

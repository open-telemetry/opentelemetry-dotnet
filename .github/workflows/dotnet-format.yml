# Called by ci.yml to perform dotnet format linting
# See: https://docs.github.com/en/actions/using-workflows/reusing-workflows#creating-a-reusable-workflow
name: Lint - dotnet format

on:
  workflow_call:

permissions: {}

jobs:
  run-dotnet-format:
    name: Run dotnet format
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
        show-progress: false

    - name: Check changed files
      id: check
      shell: pwsh
      run: |
        $baseRef = if (${env:GITHUB_BASE_REF}) { "origin/${env:GITHUB_BASE_REF}" } else { "HEAD~1" }
        $changedFiles = git diff --name-only "$baseRef...HEAD"

        $formatConfigurationFiles = $changedFiles | Where-Object {
          $_ -match '(^|/)(global\.json|\.editorconfig)$'
        }

        if ($formatConfigurationFiles) {
          Write-Output "A format configuration or global.json was changed - checking all files."
          "run-format=true" >> ${env:GITHUB_OUTPUT}
          "include-args=" >> ${env:GITHUB_OUTPUT}
        } else {
          $csFiles = $changedFiles | Where-Object { $_ -match '\.cs$' }

          if (-not $csFiles) {
            Write-Output "No C# files changed."
            "run-format=false" >> ${env:GITHUB_OUTPUT}
          } else {
            Write-Output "Checking: $csFiles"
            "run-format=true" >> ${env:GITHUB_OUTPUT}
            "include-args=$($csFiles -join ' ')" >> ${env:GITHUB_OUTPUT}
          }
        }

    - name: Setup .NET
      if: steps.check.outputs.run-format == 'true'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

    - name: dotnet format
      if: steps.check.outputs.run-format == 'true'
      shell: pwsh
      env:
        INCLUDE_FILES: ${{ steps.check.outputs.include-args }}
      run: |
        # Only whitespace is checked here as code style and analyzer rules are
        # enforced by the build (EnforceCodeStyleInBuild and TreatWarningsAsErrors).
        # Using --folder means no restore or project evaluation is needed.
        $formatArgs = @(
          'whitespace',
          '--folder',
          '--verify-no-changes'
        )

        if (${env:INCLUDE_FILES}) {
          $formatArgs += @('--include') + ${env:INCLUDE_FILES}.Split(' ')
        }

        dotnet format $formatArgs

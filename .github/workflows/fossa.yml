name: FOSSA scanning

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fossa:
    name: Run FOSSA scan
    permissions:
      contents: read
    uses: open-telemetry/shared-workflows/.github/workflows/fossa.yml@f73c28e3be66444181acb54f07ada23f144c0c39 # v0.25.0
    secrets:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}

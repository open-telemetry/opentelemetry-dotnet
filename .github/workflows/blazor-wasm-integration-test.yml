name: Blazor WASM integration tests

on:
  workflow_call:
    inputs:
      trigger:
        required: true
        type: string

permissions:
  contents: read

jobs:
  run-blazor-wasm-integration-test:
    name: Blazor WASM integration tests

    strategy:
      fail-fast: ${{ inputs.trigger == 'merge_group' }}
      matrix:
        os:
          # renovate: datasource=github-runners depType=github-runner
          - ubuntu-26.04
          # renovate: datasource=github-runners depType=github-runner
          - windows-2025

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        filter: 'tree:0'
        persist-credentials: false
        show-progress: false

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

    - name: Stop background apt services
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -x
        sudo systemctl stop apt-daily.service apt-daily-upgrade.service apt-daily.timer apt-daily-upgrade.timer unattended-upgrades.service 2>/dev/null || true
        sudo systemctl disable apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
        sudo killall apt.systemd.daily 2>/dev/null || true
        for _ in $(seq 1 30); do
          if sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; then
            echo "Waiting for apt/dpkg lock to be released..."
            sleep 2
          else
            break
          fi
        done

    - name: Install wasm-tools workload
      shell: pwsh
      run: dotnet workload install wasm-tools

    - name: Build Blazor WASM end-to-end tests
      shell: pwsh
      run: >
        dotnet build test/OpenTelemetry.BlazorWasm.Tests/OpenTelemetry.BlazorWasm.Tests.csproj
        --configuration Release

    - name: Install Playwright browser and dependencies
      if: runner.os == 'Linux'
      shell: pwsh
      timeout-minutes: 15
      run: |
        $playwright = "artifacts/bin/OpenTelemetry.BlazorWasm.Tests/release_net10.0/playwright.ps1"
        $attempts = 3
        for ($attempt = 1; $attempt -le $attempts; $attempt++) {
          & $playwright install chromium --with-deps
          if ($LASTEXITCODE -eq 0) {
            break
          }
          if ($attempt -eq $attempts) {
            throw "Failed to install Playwright after $attempts attempts."
          }
          Write-Host "::warning::Playwright install attempt $attempt failed with exit code $LASTEXITCODE, retrying."
          Start-Sleep -Seconds 10
        }

    - name: Run Blazor WASM end-to-end tests
      shell: pwsh
      run: >
        dotnet test test/OpenTelemetry.BlazorWasm.Tests/OpenTelemetry.BlazorWasm.Tests.csproj
        --configuration Release
        --no-build
        --no-restore
        --report-github
        --report-github-summary-include-passed false

    - name: Upload Playwright artifacts
      if: ${{ failure() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: blazor-playwright-artifacts-${{ matrix.os }}
        path: '**/playwright/**'
        if-no-files-found: ignore
        retention-days: 7

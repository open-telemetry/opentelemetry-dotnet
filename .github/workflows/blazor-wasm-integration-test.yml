name: Blazor WASM integration tests

on:
  workflow_call:
    inputs:
      trigger:
        required: true
        type: string

permissions:
  contents: read

jobs:
  run-blazor-wasm-integration-test:
    name: Blazor WASM integration tests

    strategy:
      fail-fast: ${{ inputs.trigger == 'merge_group' }}
      matrix:
        os:
          # renovate: datasource=github-runners depType=github-runner
          - ubuntu-24.04
          # renovate: datasource=github-runners depType=github-runner
          - windows-2025
        version: [ net10.0, net11.0 ]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        filter: 'tree:0'
        persist-credentials: false
        show-progress: false

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

    - name: Stop background apt services
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -x
        sudo systemctl stop apt-daily.service apt-daily-upgrade.service apt-daily.timer apt-daily-upgrade.timer unattended-upgrades.service 2>/dev/null || true
        sudo systemctl disable apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
        sudo killall apt.systemd.daily 2>/dev/null || true
        for _ in $(seq 1 30); do
          if sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; then
            echo "Waiting for apt/dpkg lock to be released..."
            sleep 2
          else
            break
          fi
        done

    - name: Install wasm-tools workload
      shell: pwsh
      run: dotnet workload install wasm-tools

    - name: Run Blazor WASM end-to-end tests
      shell: pwsh
      run: >
        dotnet test test/OpenTelemetry.BlazorWasm.Tests/OpenTelemetry.BlazorWasm.Tests.csproj
        --configuration Release
        --framework ${env:TARGET_FRAMEWORK}
        --logger:"GitHubActions;report-warnings=false"
      env:
        TARGET_FRAMEWORK: ${{ matrix.version }}

    - name: Upload Playwright artifacts
      if: ${{ failure() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: blazor-playwright-artifacts-${{ matrix.os }}-${{ matrix.version }}
        path: '**/playwright/**'
        if-no-files-found: ignore
        retention-days: 7
